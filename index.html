<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elvyn Ball Seating Plan Generator</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .inputs { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:disabled { background: #ccc; }
        #console-log { background: #2c3e50; color: #ecf0f1; padding: 15px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px; border-radius: 5px; }
        .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .table-card { background: white; border: 1px solid #ddd; padding: 10px; border-radius: 5px; border-top: 5px solid #3498db; }
        .table-full { border-top-color: #e74c3c; }
        ul { list-style: none; padding: 0; }
        li { font-size: 0.9em; padding: 3px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h2>Elvyn Ball Seating Plan</h2>
    
    <div class="card inputs">
        <div style="flex: 2">
            <label>Group Sizes</label><br>
            <input type="text" id="group-sizes" style="width: 100%" value="10, 8, 8, 5, 2, 10, 10, 10, 6, 4, 10, 10, 5">
        </div>
        <div>
            <label>Tables</label><br>
            <input type="number" id="num-tables" value="23" style="width: 60px">
        </div>
        <button id="run-btn">Run GA</button>
        <button id="demo-btn" style="background: #27ae60;">Demo</button>
    </div>

    <div id="console-log">Ready...</div>

    <div id="results" style="display:none;">
        <div class="card" id="summary"></div>
        <div class="table-grid" id="table-view"></div>
    </div>
</div>

<script>
    // --- UTILITIES ---
    const logEl = document.getElementById('console-log');
    const log = (msg) => {
        const d = new Date();
        logEl.innerHTML += `<div>[${d.toLocaleTimeString()}] ${msg}</div>`;
        logEl.scrollTop = logEl.scrollHeight;
    };

    // Fast copy specifically for this data structure (much faster than JSON.parse)
    function cloneTables(tables) {
        return tables.map(t => ({
            id: t.id,
            capacity: t.capacity,
            groups: t.groups.map(g => ({ ...g }))
        }));
    }

    // --- GA LOGIC ---
    async function runGA() {
        const btn = document.getElementById('run-btn');
        btn.disabled = true;
        
        const rawSizes = document.getElementById('group-sizes').value.split(',').map(n => parseInt(n.trim())).filter(n => n > 0);
        const tableCount = parseInt(document.getElementById('num-tables').value);
        const originalGroups = rawSizes.map((size, i) => ({ id: i + 1, size }));

        log(`Starting... Seating ${rawSizes.reduce((a,b)=>a+b, 0)} people across ${tableCount} tables.`);

        // 1. Initial Seed (Greedy)
        let bestTables = generateSeed(originalGroups, tableCount);
        let bestFitness = calcFitness(bestTables, originalGroups);

        // 2. Evolution Loop
        for (let gen = 0; gen < 100; gen++) {
            // Create a small mutation of the best
            let candidate = mutate(cloneTables(bestTables), originalGroups);
            candidate = repair(candidate, originalGroups);
            let cFitness = calcFitness(candidate, originalGroups);

            if (cFitness > bestFitness) {
                bestFitness = cFitness;
                bestTables = candidate;
            }

            if (gen % 20 === 0) {
                log(`Generation ${gen}... Current Score: ${bestFitness}`);
                await new Promise(r => setTimeout(r, 1)); // Yield to UI
            }
        }

        log("✅ Done!");
        render(bestTables, originalGroups);
        btn.disabled = false;
    }

    function generateSeed(groups, count) {
        let tables = Array.from({length: count}, (_, i) => ({ id: i+1, capacity: 10, groups: [] }));
        groups.forEach(g => {
            for(let t of tables) {
                let used = t.groups.reduce((a,b)=>a+b.size, 0);
                if (used + g.size <= 10) {
                    t.groups.push({ id: g.id, size: g.size });
                    return;
                }
            }
            // If it doesn't fit, just shove it in the first table (repair will fix it)
            tables[0].groups.push({ id: g.id, size: g.size });
        });
        return tables;
    }

    function calcFitness(tables, originals) {
        let score = 10000;
        let seatedMap = new Map();

        tables.forEach(t => {
            let used = 0;
            t.groups.forEach(g => {
                used += g.size;
                seatedMap.set(g.id, (seatedMap.get(g.id) || 0) + 1);
            });
            if (used > 10) score -= (used - 10) * 500; // Penalty for overfilling
        });

        seatedMap.forEach((count, id) => {
            if (count > 1) score -= (count - 1) * 100; // Penalty for splitting
        });

        return score;
    }

    function mutate(tables, originals) {
        let t1 = tables[Math.floor(Math.random() * tables.length)];
        let t2 = tables[Math.floor(Math.random() * tables.length)];
        if (t1.groups.length > 0) {
            t2.groups.push(t1.groups.pop());
        }
        return tables;
    }

    function repair(tables, originals) {
        // Simple repair: if a table is way over, move last group to a random table
        tables.forEach(t => {
            while (t.groups.reduce((a,b)=>a+b.size,0) > 12) {
                let g = t.groups.pop();
                tables[Math.floor(Math.random() * tables.length)].groups.push(g);
            }
        });
        return tables;
    }

    function render(tables, originals) {
        document.getElementById('results').style.display = 'block';
        const grid = document.getElementById('table-view');
        grid.innerHTML = '';
        
        tables.forEach(t => {
            let used = t.groups.reduce((a,b)=>a+b.size, 0);
            let items = t.groups.map(g => `<li>Group ${g.id} (Size: ${g.size})</li>`).join('');
            grid.innerHTML += `
                <div class="table-card ${used >= 10 ? 'table-full' : ''}">
                    <strong>Table ${t.id}</strong> (${used}/10)
                    <ul>${items || '<li>Empty</li>'}</ul>
                </div>`;
        });
    }

    document.getElementById('run-btn').onclick = runGA;
    document.getElementById('demo-btn').onclick = () => {
        document.getElementById('group-sizes').value = Array.from({length: 30}, () => Math.floor(Math.random() * 8) + 2).join(', ');
        runGA();
    };
</script>

</body>
</html>
